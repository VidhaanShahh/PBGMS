services:
  # PBGMS Express Backend Service - 100% Free Plan (No credit card or paid disk required)
  - type: web
    name: pbgms-backend
    env: node
    plan: free # Zero-cost tier: spins down on inactivity, restarts on incoming requests
    buildCommand: npm install --prefix server
    startCommand: npm start --prefix server
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://pbgms.netlify.app
      - key: JWT_SECRET
        generateValue: true
      - key: PAYMENT_GATEWAY_LIVE
        value: false
